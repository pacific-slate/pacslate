<svg xmlns="http://www.w3.org/2000/svg" width="560" height="590" viewBox="0 0 560 590" role="img" aria-label="Path of a request. One: the request is classified and assigned to a specialist. Two: that specialist loads context from memory and stored files. Three: a model is selected for the job, with a substitute if it is unavailable. Four: the answer returns with its sources, the model used, and the cost. Five: anything durable is written back to memory.">
  <defs>
    <style>
      .bg{fill:#0b0c0e}
      .card{fill:#121419;stroke:rgba(255,255,255,0.10)}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .kicker{fill:#6d7178;font-size:14px;letter-spacing:.18em}
      .n{fill:#6ee0ad;font-size:15px}
      .t{fill:#e7e8ea;font-size:19px;font-weight:640}
      .d{fill:#abb0b8;font-size:15.5px}
      .arrow{stroke:#6ee0ad;stroke-width:1.5;fill:none;stroke-opacity:.5}
      .ah{fill:#6ee0ad;fill-opacity:.5}
    </style>
  </defs>
  <rect class="bg" width="560" height="590" rx="10"/>
  <text class="mono kicker" x="28" y="42">PATH OF A REQUEST</text>

  <rect class="card" x="28" y="62" width="504" height="80" rx="9"/>
  <text class="mono n" x="52" y="92">1</text>
  <text class="sans t" x="78" y="94">Classified and assigned</text>
  <text class="sans d" x="78" y="120">to the specialist that fits the request.</text>
  <path class="arrow" d="M280 142 L280 166"/><polygon class="ah" points="280,166 275,156 285,156"/>

  <rect class="card" x="28" y="170" width="504" height="80" rx="9"/>
  <text class="mono n" x="52" y="200">2</text>
  <text class="sans t" x="78" y="202">Context loaded</text>
  <text class="sans d" x="78" y="228">from memory and stored files.</text>
  <path class="arrow" d="M280 250 L280 274"/><polygon class="ah" points="280,274 275,264 285,264"/>

  <rect class="card" x="28" y="278" width="504" height="80" rx="9"/>
  <text class="mono n" x="52" y="308">3</text>
  <text class="sans t" x="78" y="310">Model selected</text>
  <text class="sans d" x="78" y="336">with a substitute if the first is unavailable.</text>
  <path class="arrow" d="M280 358 L280 382"/><polygon class="ah" points="280,382 275,372 285,372"/>

  <rect class="card" x="28" y="386" width="504" height="80" rx="9"/>
  <text class="mono n" x="52" y="416">4</text>
  <text class="sans t" x="78" y="418">Answer returned</text>
  <text class="sans d" x="78" y="444">with sources, model used, and cost.</text>
  <path class="arrow" d="M280 466 L280 490"/><polygon class="ah" points="280,490 275,480 285,480"/>

  <rect class="card" x="28" y="494" width="504" height="72" rx="9"/>
  <text class="mono n" x="52" y="524">5</text>
  <text class="sans t" x="78" y="526">Durable facts written back</text>
  <text class="sans d" x="78" y="550">to memory.</text>
</svg>
