<svg xmlns="http://www.w3.org/2000/svg" width="560" height="600" viewBox="0 0 560 600" role="img" aria-label="Ownership split. Held on my own server: my files and notes, the stored memory, the tools, and the routing and spending rules. Rented: the AI model, reached over a standard interface and replaceable without changes elsewhere. A model can also be run on the same server when nothing should leave it.">
  <defs>
    <style>
      .bg{fill:#0b0c0e}
      .own{fill:#121419;stroke:#6ee0ad;stroke-opacity:.50}
      .card{fill:#121419;stroke:rgba(255,255,255,0.10)}
      .chip{fill:#0b0c0e;stroke:rgba(255,255,255,0.18)}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .kicker{fill:#6d7178;font-size:14px;letter-spacing:.18em}
      .glabel{fill:#6ee0ad;font-size:14px;letter-spacing:.16em}
      .t{fill:#e7e8ea;font-size:18.5px;font-weight:640}
      .d{fill:#abb0b8;font-size:15.5px}
      .f{fill:#6d7178;font-size:15px}
      .arrow{stroke:#6ee0ad;stroke-width:1.5;fill:none;stroke-opacity:.6}
      .ah{fill:#6ee0ad;fill-opacity:.6}
    </style>
  </defs>
  <rect class="bg" width="560" height="600" rx="10"/>
  <text class="mono kicker" x="28" y="42">OWNERSHIP</text>

  <rect class="own" x="28" y="64" width="504" height="258" rx="10"/>
  <text class="mono glabel" x="52" y="94">HELD ON MY OWN SERVER</text>

  <rect class="chip" x="52" y="112" width="222" height="76" rx="8"/>
  <text class="sans t" x="72" y="142">Files and notes</text>
  <text class="sans d" x="72" y="168">the source material</text>

  <rect class="chip" x="286" y="112" width="222" height="76" rx="8"/>
  <text class="sans t" x="306" y="142">Stored memory</text>
  <text class="sans d" x="306" y="168">what carries between sessions</text>

  <rect class="chip" x="52" y="204" width="222" height="76" rx="8"/>
  <text class="sans t" x="72" y="234">Tools</text>
  <text class="sans d" x="72" y="260">search, files, code, feeds</text>

  <rect class="chip" x="286" y="204" width="222" height="76" rx="8"/>
  <text class="sans t" x="306" y="234">Routing and limits</text>
  <text class="sans d" x="306" y="260">what runs, and what it may spend</text>

  <text class="sans f" x="52" y="308">Exportable, deletable, not used for training.</text>

  <path class="arrow" d="M234 330 L234 372"/><polygon class="ah" points="234,372 229,362 239,362"/>
  <text class="sans f" x="254" y="350">request out, answer back</text>
  <path class="arrow" d="M326 372 L326 330"/><polygon class="ah" points="326,330 321,340 331,340"/>

  <rect class="card" x="28" y="380" width="504" height="112" rx="10"/>
  <text class="mono kicker" x="52" y="410">RENTED</text>
  <text class="sans t" x="52" y="440">The AI model</text>
  <text class="sans d" x="52" y="466">Reached over a standard interface, so a different one</text>
  <text class="sans d" x="52" y="486">can be substituted without changes elsewhere.</text>

  <rect class="card" x="28" y="504" width="504" height="60" rx="10"/>
  <text class="sans d" x="52" y="532">A model can also run on the same server, when nothing</text>
  <text class="sans d" x="52" y="552">should leave it.</text>
</svg>
