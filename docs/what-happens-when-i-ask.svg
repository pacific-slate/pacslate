<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620" role="img" aria-label="What happens when I ask it something. First, the question is sized up and handed to whichever specialist suits it. That specialist gathers what it needs from memory and from my own material. It picks a suitable model for the job, and moves to another if one is unavailable. The answer comes back with its sources and what the work cost. Anything worth remembering is written down for next time.">
  <defs>
    <style>
      .bg{fill:#0b0c0e}
      .card{fill:#121419;stroke:rgba(255,255,255,0.10)}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .kicker{fill:#6d7178;font-size:14px;letter-spacing:.18em}
      .n{fill:#6ee0ad;font-size:15px;letter-spacing:.06em}
      .t{fill:#e7e8ea;font-size:20px;font-weight:640}
      .d{fill:#abb0b8;font-size:16px}
      .arrow{stroke:#6ee0ad;stroke-width:1.5;fill:none;stroke-opacity:.55}
      .ah{fill:#6ee0ad;fill-opacity:.55}
    </style>
  </defs>
  <rect class="bg" width="560" height="620" rx="10"/>
  <text class="mono kicker" x="28" y="42">WHAT HAPPENS WHEN I ASK IT SOMETHING</text>

  <rect class="card" x="28" y="66" width="504" height="84" rx="9"/>
  <text class="mono n" x="52" y="96">1</text>
  <text class="sans t" x="80" y="98">It sizes up the question</text>
  <text class="sans d" x="80" y="126">and hands it to whichever specialist suits it.</text>
  <path class="arrow" d="M280 150 L280 176"/><polygon class="ah" points="280,176 275,166 285,166"/>

  <rect class="card" x="28" y="180" width="504" height="84" rx="9"/>
  <text class="mono n" x="52" y="210">2</text>
  <text class="sans t" x="80" y="212">That specialist gathers context</text>
  <text class="sans d" x="80" y="240">from memory and from my own material.</text>
  <path class="arrow" d="M280 264 L280 290"/><polygon class="ah" points="280,290 275,280 285,280"/>

  <rect class="card" x="28" y="294" width="504" height="84" rx="9"/>
  <text class="mono n" x="52" y="324">3</text>
  <text class="sans t" x="80" y="326">It picks a model to do the work</text>
  <text class="sans d" x="80" y="354">and moves to another if one is unavailable.</text>
  <path class="arrow" d="M280 378 L280 404"/><polygon class="ah" points="280,404 275,394 285,394"/>

  <rect class="card" x="28" y="408" width="504" height="84" rx="9"/>
  <text class="mono n" x="52" y="438">4</text>
  <text class="sans t" x="80" y="440">The answer comes back</text>
  <text class="sans d" x="80" y="468">with its sources, and what the work cost.</text>
  <path class="arrow" d="M280 492 L280 518"/><polygon class="ah" points="280,518 275,508 285,508"/>

  <rect class="card" x="28" y="522" width="504" height="62" rx="9"/>
  <text class="mono n" x="52" y="552">5</text>
  <text class="sans t" x="80" y="554">Anything worth keeping is remembered</text>
  <text class="sans d" x="80" y="576">so I don't start from scratch next time.</text>
</svg>
