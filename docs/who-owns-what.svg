<svg xmlns="http://www.w3.org/2000/svg" width="560" height="740" viewBox="0 0 560 740" role="img" aria-label="Where the data sits. What I connect, documents notes code and feeds, is ingested, de-duplicated, and screened for credentials and personal data. It is then held on my own server: the knowledge corpus, stored memory, tools, and the routing and spending limits. That material accumulates there, and is exportable, deletable, and not used for training. Below it, reached across a standard interface, is the rented model: the request goes out with context already loaded, and the answer returns with its sources and cost. Replacing the model is a configuration change, and nothing above it moves.">
  <defs>
    <style>
      .bg{fill:#0b0c0e}
      .own{fill:#121419;stroke:#6ee0ad;stroke-opacity:.50}
      .card{fill:#121419;stroke:rgba(255,255,255,0.10)}
      .chip{fill:#0b0c0e;stroke:rgba(255,255,255,0.18)}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .kicker{fill:#6d7178;font-size:14px;letter-spacing:.18em}
      .glabel{fill:#6ee0ad;font-size:14px;letter-spacing:.16em}
      .t{fill:#e7e8ea;font-size:18.5px;font-weight:640}
      .s{fill:#e7e8ea;font-size:15.5px;font-weight:600}
      .d{fill:#abb0b8;font-size:15.5px}
      .f{fill:#6d7178;font-size:15px}
      .arrow{stroke:#6ee0ad;stroke-width:1.5;fill:none;stroke-opacity:.6}
      .ah{fill:#6ee0ad;fill-opacity:.6}
      .edge{stroke:rgba(255,255,255,0.22);stroke-width:1;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect class="bg" width="560" height="740" rx="10"/>
  <text class="mono kicker" x="28" y="42">WHERE THE DATA SITS</text>

  <rect class="card" x="28" y="62" width="504" height="112" rx="10"/>
  <text class="mono kicker" x="52" y="92">WHAT I CONNECT</text>
  <rect class="chip" x="52" y="110" width="106" height="48" rx="8"/>
  <text class="sans s" x="105" y="140" text-anchor="middle">Documents</text>
  <rect class="chip" x="168" y="110" width="106" height="48" rx="8"/>
  <text class="sans s" x="221" y="140" text-anchor="middle">Notes</text>
  <rect class="chip" x="284" y="110" width="106" height="48" rx="8"/>
  <text class="sans s" x="337" y="140" text-anchor="middle">Code</text>
  <rect class="chip" x="400" y="110" width="106" height="48" rx="8"/>
  <text class="sans s" x="453" y="140" text-anchor="middle">Feeds</text>

  <path class="arrow" d="M60 174 L60 216"/><polygon class="ah" points="60,216 55,206 65,206"/>
  <text class="sans d" x="84" y="192">Ingested, de-duplicated, and screened</text>
  <text class="sans d" x="84" y="212">for credentials and personal data.</text>

  <rect class="own" x="28" y="226" width="504" height="250" rx="10"/>
  <text class="mono glabel" x="52" y="256">HELD ON MY OWN SERVER</text>

  <rect class="chip" x="52" y="274" width="222" height="72" rx="8"/>
  <text class="sans t" x="72" y="304">Knowledge corpus</text>
  <text class="sans d" x="72" y="328">documents, indexed</text>

  <rect class="chip" x="286" y="274" width="222" height="72" rx="8"/>
  <text class="sans t" x="306" y="304">Stored memory</text>
  <text class="sans d" x="306" y="328">carries between sessions</text>

  <rect class="chip" x="52" y="358" width="222" height="72" rx="8"/>
  <text class="sans t" x="72" y="388">Tools</text>
  <text class="sans d" x="72" y="412">search, files, code</text>

  <rect class="chip" x="286" y="358" width="222" height="72" rx="8"/>
  <text class="sans t" x="306" y="388">Routing and limits</text>
  <text class="sans d" x="306" y="412">what runs, what it spends</text>

  <text class="sans f" x="52" y="452">Accumulates here. Exportable, deletable, not used for training.</text>

  <text class="mono kicker" x="532" y="494" text-anchor="end">STANDARD INTERFACE</text>
  <line class="edge" x1="28" y1="506" x2="532" y2="506"/>

  <path class="arrow" d="M56 484 L56 570"/><polygon class="ah" points="56,570 51,560 61,560"/>
  <text class="sans d" x="80" y="534">The request goes out</text>
  <text class="sans d" x="80" y="556">with context already loaded.</text>

  <path class="arrow" d="M322 570 L322 484"/><polygon class="ah" points="322,484 317,494 327,494"/>
  <text class="sans d" x="346" y="534">The answer returns</text>
  <text class="sans d" x="346" y="556">with sources and cost.</text>

  <rect class="card" x="28" y="586" width="504" height="116" rx="10"/>
  <text class="mono kicker" x="52" y="616">RENTED</text>
  <text class="sans t" x="52" y="644">The model</text>
  <text class="sans d" x="52" y="668">Reached over a standard interface, so a different</text>
  <text class="sans d" x="52" y="688">one can be substituted.</text>

  <text class="sans f" x="28" y="726">Replacing the model is a configuration change. Nothing above it moves.</text>
</svg>
